<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" font-family="system-ui, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E6E2D8" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6E8AB5"/>
    </marker>
  </defs>
  <rect width="920" height="680" fill="#FAF9F6"/>
  <rect width="920" height="680" fill="url(#grid)"/>
  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2328">TitanKV 分层架构 · make run-all</text>
  <text x="460" y="52" text-anchor="middle" font-size="11" fill="#8A8F94">Client :8080(skynet) → Gin :18080 → Services → minikv :8888</text>
  <rect x="40" y="70" width="840" height="56" rx="6" fill="#fff" stroke="#2B4C7E" stroke-width="1.5"/>
  <text x="56" y="92" font-size="11" fill="#2B4C7E" font-weight="600">L1 客户端</text>
  <text x="56" y="112" font-size="10" fill="#5C6166">Next.js web/ :3000 · CLI keyforge client-cli/ · Go SDK client-go/titan/</text>
  <rect x="40" y="140" width="840" height="56" rx="6" fill="#EAF0F8" stroke="#2B4C7E" stroke-width="1.5"/>
  <text x="56" y="162" font-size="11" fill="#2B4C7E" font-weight="600">L2 前置 Skynet :8080</text>
  <text x="56" y="182" font-size="10" fill="#5C6166">epoll ET + C++20 协程主从 Reactor · HTTP 解析 · LB → Gin :18080</text>
  <rect x="40" y="210" width="840" height="56" rx="6" fill="#fff" stroke="#2B4C7E" stroke-width="1.5"/>
  <text x="56" y="232" font-size="11" fill="#2B4C7E" font-weight="600">L3 网关 Gin :18080</text>
  <text x="56" y="252" font-size="10" fill="#5C6166">洋葱中间件 · 反代 /api/{auth,data,meta,observability,rag}</text>
  <rect x="40" y="280" width="840" height="72" rx="6" fill="#F3F1EB" stroke="#2B4C7E" stroke-width="1.5"/>
  <text x="56" y="302" font-size="11" fill="#2B4C7E" font-weight="600">L4 微服务</text>
  <text x="56" y="322" font-size="10" fill="#5C6166">Auth:8082 Data:8081 Meta:8083 Observ:8084 RAG:8085</text>
  <text x="56" y="340" font-size="10" fill="#8A8F94">Data/RAG ──TCP──▶ minikv_server :8888</text>
  <rect x="40" y="368" width="400" height="48" rx="6" fill="#fff" stroke="#8A8F94" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="56" y="390" font-size="11" fill="#8A8F94" font-weight="600">L5 分布式（教学）</text>
  <text x="56" y="406" font-size="10" fill="#8A8F94">raft · distributed/ · cmd/raft · gateway/shard.go</text>
  <rect x="40" y="432" width="840" height="88" rx="6" fill="#fff" stroke="#2B4C7E" stroke-width="1.5"/>
  <text x="56" y="454" font-size="11" fill="#2B4C7E" font-weight="600">L6 存储 MiniKV</text>
  <text x="56" y="474" font-size="10" fill="#5C6166">WAL · MemTable(shared_ptr) · SST+BlockCache · Compaction · MVCC</text>
  <text x="56" y="492" font-size="10" fill="#5C6166">主从 Reactor epoll LT · io-threads=4 · biz-threads=4</text>
  <rect x="460" y="368" width="420" height="48" rx="6" fill="#EAF0F8" stroke="#6E8AB5" stroke-width="1"/>
  <text x="476" y="390" font-size="11" fill="#2B4C7E" font-weight="600">L7 可观测性</text>
  <text x="476" y="406" font-size="10" fill="#5C6166">Prometheus · Grafana · Jaeger · Redis</text>
  <line x1="460" y1="126" x2="460" y2="140" stroke="#6E8AB5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="196" x2="460" y2="210" stroke="#6E8AB5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="266" x2="460" y2="280" stroke="#6E8AB5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="352" x2="460" y2="432" stroke="#6E8AB5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="540" width="840" height="120" rx="6" fill="#fff" stroke="#E6E2D8"/>
  <text x="56" y="564" font-size="12" font-weight="600" fill="#1F2328">端口速查</text>
  <text x="56" y="586" font-size="10" fill="#5C6166">8080 skynet · 18080 Gin · 8081-8085 微服务 · 8888 minikv · 3000 Web</text>
  <text x="56" y="608" font-size="10" fill="#5C6166">RAG: Client→skynet→Gin→rag→minikv + HNSW side index</text>
  <text x="56" y="630" font-size="10" fill="#8A8F94">docs/layers/ · 以源码为准</text>
