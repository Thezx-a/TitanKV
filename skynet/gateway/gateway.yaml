# TitanKV 方案一：skynet 前置反向代理（工程加深档）
# 对外入口 :8080 → 转发到 Gin 内网口 :18080
# Gin 仍负责 JWT / 限流 / 按路径反代到 Data 等服务
#
# skynet 前置反向代理 — epoll ET + C++20 协程事件环
# 对外 :8080 → Gin 内网 :18080
# 主从 Reactor：Main accept + Sub(listen.threads) 各 IOContext；epoll ET + co_await（非阻塞线程池 IO）
listen:
  port: 8080
  threads: 4

upstreams:
  - host: 127.0.0.1
    port: 18080
    weight: 1

health_check:
  interval: 5
  timeout: 200
  path: /healthz

limits:
  max_connections: 10000
  per_ip_max: 100
